version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tangga
      POSTGRES_USER: tangga
      POSTGRES_PASSWORD: tangga
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangga"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tangga:tangga@db:5432/tangga
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tangga:tangga@db:5432/tangga
    command: python seed_db.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

volumes:
  pgdata: